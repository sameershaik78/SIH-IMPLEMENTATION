{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="h2 logo-text text-light">Security Controls</h1>
        <p class="text-muted">Review, configure, and update defensive security controls and coverage percentages.</p>
    </div>
</div>

<!-- Controls Grid -->
<div class="row g-4" id="controls-container">
    <div class="col-12 text-center py-4 text-muted"><i class="fa-solid fa-spinner fa-spin me-2"></i>Loading security controls...</div>
</div>

<!-- Update Control Modal -->
<div class="modal fade" id="controlModal" tabindex="-1" aria-labelledby="controlModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title logo-text text-light" id="controlModalLabel">Update Control Coverage</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="control-form" onsubmit="saveControl(event)">
                <div class="modal-body">
                    <input type="hidden" id="edit-ctrl-id">
                    <div class="mb-3">
                        <label for="edit-ctrl-name" class="cyber-label">Control Name</label>
                        <input type="text" class="form-control cyber-input" id="edit-ctrl-name" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="edit-ctrl-status" class="cyber-label">Activation Status</label>
                        <select class="form-select" id="edit-ctrl-status" required>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                            <option value="Proposed">Proposed</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="edit-ctrl-coverage" class="cyber-label">Organizational Coverage (0 - 100%)</label>
                        <input type="number" class="form-control cyber-input" id="edit-ctrl-coverage" required min="0" max="100" placeholder="e.g. 85">
                    </div>
                    <div class="mb-3">
                        <label for="edit-ctrl-effectiveness" class="cyber-label">Control Effectiveness (0 - 100%)</label>
                        <input type="number" class="form-control cyber-input" id="edit-ctrl-effectiveness" required min="0" max="100" placeholder="e.g. 90">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-info border-dark">Apply Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let allControls = [];
    const role = "{{ session.user_role }}";

    document.addEventListener('DOMContentLoaded', loadControls);

    async function loadControls() {
        try {
            const response = await fetch('/api/security-controls');
            allControls = await response.json();
            renderControls(allControls);
        } catch (err) {
            console.error(err);
            showToast("Failed to fetch security controls.", "danger");
        }
    }

    function renderControls(controls) {
        const container = document.getElementById('controls-container');
        container.innerHTML = '';
        
        controls.forEach(c => {
            let statusBadge = '';
            if (c.status === 'Active') statusBadge = '<span class="badge bg-success">Active</span>';
            else if (c.status === 'Inactive') statusBadge = '<span class="badge bg-danger">Inactive</span>';
            else statusBadge = '<span class="badge bg-warning text-dark">Proposed</span>';
            
            const costHtml = formatRupees(c.implementation_cost) + ' <small class="text-muted">one-time</small><br>' + formatRupees(c.maintenance_cost) + ' <small class="text-muted">/yr</small>';
            
            const cardHtml = `
                <div class="col-12 col-md-6 col-xl-4">
                    <div class="cyber-card p-3 h-100 d-flex flex-column justify-content-between">
                        <div>
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <span class="text-muted text-xs text-uppercase fw-semibold">${c.category}</span>
                                ${statusBadge}
                            </div>
                            <h5 class="text-light fw-bold mb-2">${c.name}</h5>
                            <p class="text-muted text-xs mb-3" style="line-height:1.3; min-height: 38px;">${c.description || 'No description available.'}</p>
                            
                            <div class="bg-dark rounded p-2 mb-3">
                                <div class="d-flex justify-content-between text-xs mb-1">
                                    <span class="text-muted">Efficacy:</span>
                                    <span class="text-light fw-bold">${formatPercent(c.effectiveness)}</span>
                                </div>
                                <div class="progress mb-2" style="height: 4px;">
                                    <div class="progress-bar bg-info" style="width: ${c.effectiveness}%"></div>
                                </div>
                                <div class="d-flex justify-content-between text-xs mb-1">
                                    <span class="text-muted">Coverage:</span>
                                    <span class="text-light fw-bold">${formatPercent(c.coverage)}</span>
                                </div>
                                <div class="progress" style="height: 4px;">
                                    <div class="progress-bar bg-success" style="width: ${c.coverage}%"></div>
                                </div>
                            </div>
                        </div>
                        
                        <div>
                            <div class="d-flex justify-content-between align-items-center border-top border-dark pt-2 mt-2">
                                <div class="text-xs text-light" style="line-height:1.2;">
                                    ${costHtml}
                                </div>
                                ${ (role === 'Admin' || role === 'Security Analyst') ? `
                                    <button class="btn btn-outline-info btn-sm border-dark" onclick="openEditModal(${c.id})">
                                        <i class="fa-solid fa-pencil me-1"></i>Configure
                                    </button>
                                ` : '' }
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', cardHtml);
        });
    }

    function openEditModal(id) {
        const c = allControls.find(x => x.id === id);
        if (!c) return;
        
        document.getElementById('edit-ctrl-id').value = c.id;
        document.getElementById('edit-ctrl-name').value = c.name;
        document.getElementById('edit-ctrl-status').value = c.status;
        document.getElementById('edit-ctrl-coverage').value = c.coverage;
        document.getElementById('edit-ctrl-effectiveness').value = c.effectiveness;
        
        const modal = new bootstrap.Modal(document.getElementById('controlModal'));
        modal.show();
    }

    async function saveControl(e) {
        e.preventDefault();
        
        const id = document.getElementById('edit-ctrl-id').value;
        const data = {
            status: document.getElementById('edit-ctrl-status').value,
            coverage: parseFloat(document.getElementById('edit-ctrl-coverage').value),
            effectiveness: parseFloat(document.getElementById('edit-ctrl-effectiveness').value)
        };
        
        try {
            const response = await fetch(`/api/security-controls/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            if (response.ok) {
                showToast("Control configuration updated successfully!", 'success');
                const modalEl = document.getElementById('controlModal');
                const modal = bootstrap.Modal.getInstance(modalEl);
                if (modal) modal.hide();
                loadControls();
            } else {
                const res = await response.json();
                showToast(res.error || "Failed to update control.", 'danger');
            }
        } catch (err) {
            console.error(err);
            showToast("Network error updating control.", 'danger');
        }
    }
</script>
{% endblock %}
